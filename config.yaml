db_url: "sqlite:///data/photo_db.sqlite"
batch_size: 100
original_photo_dirs:
#  - /media/zack/ST-4000MAG4/My Pictures/D800/2014-2H
#  - /media/zack/1TB_P2/LR_jpgs/My Pictures/Z7/2021-Q3/Alaska/Anchorage etc
#  - /media/zack/1TB_P2/LR_jpgs/My Pictures/D800/2014-1H
  - /media/zack/ST-4000MAG4/My Pictures/D800
  - /media/zack/ST-4000MAG4/My Pictures/D700
  - /media/zack/ST-4000MAG4/My Pictures/Z7
  - /media/zack/1TB_P2/lr_edited_jpgs
  - /media/zack/1TB_P2/LR_jpgs
  - /media/zack/1TB_P2/Google takeout/Takeout/Google Photos

file_types : [".jpg", ".nef", ".tiff", ".xmp", ".jpeg"]
possible_metadata_keys:
  timestamp : ["Composite:SubSecCreateDate", "Composite:CreateDate", "XMP:DateTimeOriginal",
               "XMP:CreateDate", "EXIF:DateTimeOriginal"]
  label_color: ["XMP:Label"]
  rating: ["XMP:Rating", "EXIF:Rating"]
source_file_preference:
  - lr_edited_jpgs
  - My Pictures/Z7/
  - lr_jpgs/My Pictures/D800
  - My Pictures/D700/working jpegs/picasa
  - My Pictures/D700
  - lr_jpgs
  - Google Photos
destination_dir: "/media/zack/ST-4000MAG4/tv_slideshows"
default_filter:
  labels: ["Red"]
slideshows:
  - name: "All Photos"
    description: "all photos that pass default filter"
    filter:
      {} # Empty filter to include all photos that pass default filter
      #end_date: "2100-01-01" # Hack to include all photos because filter can
  - name: "Last Year"
    description: "photos from the last year"
    filter:
      start_date: "2024-10-10"
      end_date: "2025-10-11"

  - name: "Asia 2014"
    description: "photos from my Asia trip in 2014"
    filter:
      keywords: ["Asia 2014"]

  - name: "Post Ansel"
    description: "photos since Ansel was born"
    filter:
      start_date: "2022-05-05"

  - name: "Switzerland"
    description: "photos from Switzerland trip"
    filter:
       keywords: ["Switzerland"]

  - name: "Christmas"
    description: "Christmas photos"
    filter:
      date_parts:
        month: 12

  - name: "best"
    description: "best photos"
    filter:
      rating: 5

  - name: "Fall Photos"
    description: "Fall photos"
    filter:
      date_parts:
        month: 11 # Need to accommodate lists of parts
